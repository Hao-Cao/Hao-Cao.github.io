<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>词条计算器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== wf.wiki 风格设计令牌：新粗野主义 卡通贴纸风 ===== */
        :root{
            --ink:#1B1C30;          /* 深墨描边/正文 */
            --cream:#FBF4E3;        /* 奶油底色 */
            --green:#2DC56A;        /* 主草绿 */
            --green-dark:#0B3B21;   /* 绿底深字 */
            --green-light:#AFE7C1;  /* 荧光笔高亮 */
            --yellow:#F5C84C;       /* 柠檬黄 */
            --blue:#8CCBF5;         /* 天蓝 */
            --purple:#C3A8F5;       /* 香芋紫 */
            --red:#E5484D;          /* 警示红 */
            --muted:#55566E;        /* 次级文字 */
        }
        *{
            box-sizing: border-box;
        }
        html,body{
            overflow-x:hidden;
        }
        body {
            font-family:"Nunito","PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
            max-width:600px;
            margin:0 auto;
            padding:34px 16px 56px;
            color:var(--ink);
            background:
                radial-gradient(640px 420px at 6% -2%, rgba(247,184,196,.55), transparent 62%),
                radial-gradient(520px 360px at 98% 2%, rgba(178,232,197,.55), transparent 60%),
                radial-gradient(760px 520px at 50% 115%, rgba(140,203,245,.32), transparent 62%),
                var(--cream);
            background-attachment:fixed;
        }
        ::selection{background:var(--yellow)}

        /* ===== 背景漂浮装饰 ===== */
        .blob{position:fixed;z-index:0;pointer-events:none}
        .b1{width:46px;height:46px;background:var(--yellow);border:2.5px solid var(--ink);border-radius:15px;top:110px;right:6%;animation:floatA 7s ease-in-out infinite}
        .b2{width:36px;height:36px;background:var(--blue);border:2.5px solid var(--ink);border-radius:12px;bottom:12%;left:5%;animation:floatB 9s ease-in-out infinite}
        .b3{width:22px;height:22px;background:var(--green);border:2px solid var(--ink);border-radius:50%;top:48%;right:3.5%;animation:floatC 8s ease-in-out infinite}
        @media (max-width:720px){.blob{display:none}}

        /* ===== 主卡片 ===== */
        .card{
            position:relative;
            z-index:1;
            background:#ffffff;
            border:2.5px solid var(--ink);
            border-radius:24px;
            padding:28px 22px;
            box-shadow:7px 7px 0 var(--ink);
            animation:cardIn .55s cubic-bezier(.22,1,.36,1) both;
        }
        h3{
            text-align:center;
            margin:14px 0 22px;
            color:var(--ink);
            font-size:26px;
            font-weight:900;
            letter-spacing:.5px;
        }
        h3 mark{
            background:linear-gradient(180deg,transparent 56%,var(--green-light) 56%);
            color:inherit;
            padding:0 3px;
            border-radius:2px;
        }
        .top-badge{
            display:block;
            width:max-content;
            margin:0 auto;
            background:var(--yellow);
            border:2px solid var(--ink);
            border-radius:999px;
            box-shadow:2.5px 2.5px 0 var(--ink);
            padding:5px 16px;
            font-size:13px;
            font-weight:800;
        }

        /* ===== 分段切换器（模式 / 词条正负） ===== */
        .mode-select{
            margin-bottom:24px;
            text-align:center;
        }
        .seg-wrap{
            display:inline-flex;
            gap:4px;
            background:#fff;
            border:2.5px solid var(--ink);
            border-radius:999px;
            padding:4px;
            box-shadow:3px 3px 0 var(--ink);
        }
        .seg-wrap label{
            margin:0;
            cursor:pointer;
        }
        .seg-wrap input{
            position:absolute;
            opacity:0;
            pointer-events:none;
        }
        .seg-wrap span{
            display:block;
            padding:8px 18px;
            border-radius:999px;
            font-weight:700;
            font-size:15px;
            color:var(--ink);
            cursor:pointer;
            transition:background .18s,color .18s,box-shadow .18s,transform .18s;
            user-select:none;
        }
        .seg-wrap span:hover{
            background:#FFF3D6;
        }
        .seg-wrap input:checked + span{
            background:var(--green);
            color:var(--green-dark);
            box-shadow:inset 0 0 0 2px var(--ink);
            transform:scale(1.03);
        }
        .seg-wrap.danger input[value="negative"]:checked + span{
            background:#F8AFAF;
            color:#7A1C1C;
        }
        .radio-row{
            margin-bottom:8px;
        }

        .item{
            margin-bottom:18px;
        }
        label{
            display:block;
            margin-bottom:8px;
            font-weight:800;
            font-size:15.5px;
            color:var(--ink);
        }

        /* ===== 输入框 ===== */
        input[type="number"],input[type="text"]{
            width:100%;
            padding:12px 14px;
            font-size:16px;
            font-weight:600;
            color:var(--ink);
            border:2.5px solid var(--ink);
            border-radius:14px;
            outline:none;
            background:#fff;
            box-shadow:3px 3px 0 var(--ink);
            transition:transform .15s, box-shadow .15s;
            cursor:text;          /* 可输入：文本竖杠 */
            caret-color:var(--ink);
        }
        input[readonly]{
            cursor:pointer;       /* 只读下拉：小手 */
        }
        input::placeholder{
            color:#9B9CAC;
            font-weight:600;
        }
        input:focus{
            transform:translate(-1.5px,-1.5px);
            box-shadow:4.5px 4.5px 0 var(--green);
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button{
            -webkit-appearance:none;
            margin:0;
        }
        input[type=number]{
            -moz-appearance:textfield;
            appearance:textfield;
        }

        /* ===== 主按钮 ===== */
        button{
            width:100%;
            padding:14px;
            font-size:18px;
            font-weight:900;
            letter-spacing:1px;
            background:var(--green);
            color:var(--green-dark);
            border:2.5px solid var(--ink);
            border-radius:16px;
            cursor:pointer;
            margin-top:14px;
            box-shadow:4px 4px 0 var(--ink);
            transition:transform .12s, box-shadow .12s, filter .15s;
        }
        button:hover{
            transform:translate(-1.5px,-1.5px);
            box-shadow:5.5px 5.5px 0 var(--ink);
            filter:brightness(1.05);
        }
        button:active{
            transform:translate(3px,3px);
            box-shadow:0 0 0 var(--ink);
        }

        /* ===== 结果面板 ===== */
        #result{
            margin-top:22px;
            font-size:15px;
            line-height:1.7;
            background:#fff;
            border:2.5px solid var(--ink);
            border-radius:16px;
            padding:16px 18px;
            box-shadow:4px 4px 0 var(--ink);
        }
        #result:empty{display:none}
        #result.pop{animation:popIn .35s cubic-bezier(.22,1,.36,1)}
        .result-chip{
            display:inline-block;
            background:var(--purple);
            color:#fff;
            border:2px solid var(--ink);
            border-radius:999px;
            padding:4px 14px;
            font-weight:800;
            font-size:14px;
            margin-bottom:10px;
            box-shadow:2px 2px 0 var(--ink);
        }
        .result-chip.green{
            background:var(--green);
            color:var(--green-dark);
        }
        .result-row{
            display:flex;
            justify-content:space-between;
            align-items:baseline;
            gap:12px;
            flex-wrap:wrap;
            padding:7px 2px;
            border-bottom:2px dashed rgba(27,28,48,.15);
        }
        .result-row .k{color:var(--muted);font-weight:700}
        .result-row .v{font-weight:800}
        .percent-bar{
            height:18px;
            border:2px solid var(--ink);
            border-radius:999px;
            background:#fff;
            margin:12px 0 4px;
            overflow:hidden;
        }
        .percent-fill{
            height:100%;
            background:var(--green);
            border-radius:999px;
            transform-origin:left;
            animation:fillX .8s cubic-bezier(.22,1,.36,1) both;
        }
        .percent-fill.bad{background:var(--red)}
        .rank-chip{
            display:inline-block;
            border:2px solid var(--ink);
            border-radius:999px;
            padding:5px 14px;
            font-weight:800;
            font-size:14px;
            margin-top:12px;
            box-shadow:2.5px 2.5px 0 var(--ink);
            animation:popIn .3s .1s both;
        }
        .rank-1{background:#FAD4D4;color:#8F1D1D}
        .rank-2{background:#FDE3C8;color:#9C4A06}
        .rank-3{background:#FDF3C7;color:#8A6D00}
        .rank-4{background:#D9F2DC;color:#1F6B38}
        .rank-5{background:var(--green-light);color:var(--green-dark)}
        .warnbox{
            margin-top:12px;
            background:#FDE3E3;
            border:2.5px solid var(--ink);
            border-radius:12px;
            padding:10px 14px;
            color:#8F1D1D;
            font-weight:800;
            box-shadow:3px 3px 0 var(--ink);
            animation:shake .45s;
        }
        .tip{
            font-size:13px;
            color:var(--muted);
            font-weight:600;
            margin:-4px 0 12px;
        }

        /* ===== 自定义下拉组件 ===== */
        .combobox-wrap{
            position:relative;
        }
        .combobox-input{
            padding-right:36px;
        }
        .combobox-wrap::after{
            content:"▼";
            position:absolute;
            right:14px;
            top:50%;
            transform:translateY(-50%);
            color:var(--ink);
            pointer-events:none;
            font-size:12px;
        }
        .combobox-dropdown{
            position:absolute;
            left:0;
            right:0;
            top:calc(100% + 6px);
            background:#ffffff;
            border:2.5px solid var(--ink);
            border-radius:14px;
            max-height:260px;
            overflow-y:auto;
            z-index:100;
            display:none;
            padding:6px;
            box-shadow:4px 4px 0 var(--ink);
            animation:dropIn .18s ease both;
        }
        .combobox-dropdown::-webkit-scrollbar{width:8px}
        .combobox-dropdown::-webkit-scrollbar-thumb{background:var(--ink);border-radius:8px}
        .combobox-dropdown::-webkit-scrollbar-track{background:transparent}
        .combobox-item{
            display:block;
            width:100%;
            padding:10px 12px;
            border:none;
            background:transparent;
            box-shadow:none;
            border-radius:9px;
            cursor:pointer;
            font-weight:600;
            font-size:15px;
            font-family:inherit;
            color:var(--ink);
            text-align:left;
            transition:background .13s, padding-left .13s;
        }
        .combobox-item:hover,
        .combobox-item:active{
            background:#FFF1C9;
            padding-left:18px;
            transform:none;
            box-shadow:none;
            filter:none;
        }
        .keyword-highlight{
            color:#0B7A3E;
            background:#DFF7E7;
            border-radius:4px;
            padding:0 2px;
            font-weight:800;
        }

        /* 面板切换入场动画 */
        .panel{animation:fadeUp .3s ease both}

        /* ===== 动画定义 ===== */
        @keyframes cardIn{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        @keyframes dropIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
        @keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.94)}to{opacity:1;transform:none}}
        @keyframes shake{
            0%,100%{transform:translateX(0)}
            20%{transform:translateX(-5px)}
            40%{transform:translateX(5px)}
            60%{transform:translateX(-3px)}
            80%{transform:translateX(3px)}
        }
        @keyframes fillX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
        @keyframes floatA{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(10deg)}}
        @keyframes floatB{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(12px) rotate(-12deg)}}
        @keyframes floatC{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.2)}}
    </style>
</head>
<body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>

    <div class="card">
        <div class="top-badge">● Warframe 玩家工具</div>
        <h3>Warframe <mark>裂罅紫卡</mark> 词条计算器</h3>
        <div class="mode-select">
            <div class="seg-wrap">
                <label><input type="radio" name="mode" value="forward" onclick="switchMode()"><span>正向计算</span></label>
                <label><input type="radio" name="mode" value="reverse" checked onclick="switchMode()"><span>反向计算</span></label>
            </div>
        </div>

        <!-- 正向面板 -->
        <div id="forwardPanel" class="panel" style="display:none">
            <div class="item">
                <label>词条类型</label>
                <div class="combobox-wrap">
                    <input class="combobox-input" type="text" id="statInputF" placeholder="输入关键词搜索，点击展开全部">
                    <div class="combobox-dropdown" id="dropdownF"></div>
                    <input type="hidden" id="statValueF">
                </div>
            </div>
            <div class="item">
                <label>武器类型</label>
                <div class="combobox-wrap">
                    <input class="combobox-input" type="text" id="weaponInputF" placeholder="输入关键词搜索，点击展开全部">
                    <div class="combobox-dropdown" id="weaponDropdownF"></div>
                    <input type="hidden" id="weaponValueF">
                </div>
            </div>
            <div class="item">
                <label>属性组合修正系数</label>
                <div class="combobox-wrap">
                    <input class="combobox-input" type="text" id="propInputF" readonly placeholder="点击展开选项">
                    <div class="combobox-dropdown" id="propDropdownF"></div>
                    <input type="hidden" id="propValueF">
                </div>
            </div>
            <div class="item" id="customPropForward" style="display:none">
                <label>自定义属性系数</label>
                <input type="number" step="0.0001" id="propCoef" min="0" placeholder="手动输入系数">
            </div>
            <div class="item">
                <label>裂罅倾向系数</label>
                <input type="number" step="0.01" id="riftCoef" min="0.1" max="2" placeholder="如0.69">
            </div>
            <div class="item">
                <label>浮动系数(0.9‑1.1)</label>
                <input type="number" step="0.01" id="floatCoef" min="0.9" max="1.1" placeholder="如1.10">
            </div>
        </div>

        <!-- 反向面板【默认打开】 -->
        <div id="reversePanel" class="panel">
            <div class="item">
                <label>词条类型</label>
                <div class="combobox-wrap">
                    <input class="combobox-input" type="text" id="statInputR" placeholder="输入关键词搜索，点击展开全部">
                    <div class="combobox-dropdown" id="dropdownR"></div>
                    <input type="hidden" id="statValueR">
                </div>
            </div>
            <div class="item">
                <label>武器类型</label>
                <div class="combobox-wrap">
                    <input class="combobox-input" type="text" id="weaponInputR" placeholder="输入关键词搜索，点击展开全部">
                    <div class="combobox-dropdown" id="weaponDropdownR"></div>
                    <input type="hidden" id="weaponValueR">
                </div>
            </div>
            <div class="item">
                <label>裂罅倾向系数</label>
                <div class="combobox-wrap">
                    <input class="combobox-input" type="text" id="riftLvInputR" readonly placeholder="点击展开选项">
                    <div class="combobox-dropdown" id="riftLvDropdownR"></div>
                    <input type="hidden" id="riftLvValueR">
                </div>
            </div>
            <div class="item">
                <label>词条属性类型</label>
                <div class="seg-wrap danger radio-row">
                    <label><input type="radio" name="statTypeR" value="positive" checked><span>正向词条</span></label>
                    <label><input type="radio" name="statTypeR" value="negative"><span>负面词条</span></label>
                </div>
                <label>最终词条数值</label>
                <input type="number" step="0.01" id="finalVal" min="0" placeholder="填刷出来的成品数值">
            </div>
            <div class="item">
                <label>属性组合修正系数</label>
                <div class="combobox-wrap">
                    <input class="combobox-input" type="text" id="propInputR" readonly placeholder="点击展开选项">
                    <div class="combobox-dropdown" id="propDropdownR"></div>
                    <input type="hidden" id="propValueR">
                </div>
            </div>
            <div class="item" id="customPropReverse" style="display:none">
                <label>自定义属性系数</label>
                <input type="number" step="0.0001" id="propCoefR" min="0" placeholder="手动输入系数">
            </div>
            <p class="tip">浮动系数固定范围：0.9 ~ 1.1</p>
        </div>

        <button onclick="calc()">计算</button>
        <div id="result"></div>
    </div>

<script>
// 数据源
const statOptions = [

const weaponOptions = [

//属性修正改为2+0格式
const propOptions = [

//裂罅等级：Lv.<b>数字</b> 区间，数字加粗，区间不加粗
const riftLvOptions = [

const baseTable = {

const riftLevelList = [

//关键词高亮
function highlightText(text, keyword){
    if(!keyword.trim()) return text;
    const reg = new RegExp(`(${keyword.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,"gi");
    return text.replace(reg,`<span class="keyword-highlight">$1</span>`);
}

/**
 * 通用combobox工厂函数
 * @param {string} inputId
 * @param {string} dropdownId
 * @param {string} hiddenId
 * @param {Array} optList
 * @param {boolean} allowHtml 是否允许html标签
 * @param {boolean} enableSearch 是否开启输入搜索过滤
 * @param {Function} onSelect
 */
function createCombobox(inputId, dropdownId, hiddenId, optList, allowHtml=false, enableSearch=true, onSelect=null){
    const input = document.getElementById(inputId);
    const dropdown = document.getElementById(dropdownId);
    const hidden = document.getElementById(hiddenId);
    dropdown.setAttribute("role","listbox");

    function render(keyword=""){
        let list;
        if(enableSearch && keyword){
            list = optList.filter(o=>o.label.replace(/<[^>]+>/g,"").toLowerCase().includes(keyword.toLowerCase()));
        }else{
            list = optList;
        }
        dropdown.innerHTML = "";
        if(list.length===0){
            dropdown.innerHTML = `<div class="combobox-item">无匹配</div>`;
        }else{
            list.forEach(opt=>{
                const div = document.createElement("button");
                div.type = "button";
                div.className="combobox-item";
                div.setAttribute("role","option");
                const plainText = opt.label.replace(/<[^>]+>/g,"");
                if(allowHtml){
                    div.innerHTML = (enableSearch && keyword) ? highlightText(plainText, keyword) : opt.label;
                }else{
                    div.innerHTML = enableSearch ? highlightText(opt.label, keyword) : opt.label;
                }
                div.onclick = ()=>{
                    input.value = plainText;
                    hidden.value = opt.value;
                    input.dataset.opt = JSON.stringify(opt);
                    dropdown.style.display="none";
                    if(typeof onSelect === "function") onSelect(opt);
                };
                dropdown.appendChild(div);
            })
        }
        dropdown.style.display="block";
    }
    function close(){
        dropdown.style.display="none";
    }

    if(enableSearch){
        input.addEventListener("focus",()=>render(input.value));
        //用户手动输入时清除已选中的缓存值，避免依据前一次选中的有效项输出
        input.addEventListener("input",()=>{
            hidden.value = "";
            delete input.dataset.opt;
            render(input.value);
        });
    }else{
        input.addEventListener("click",()=>render(""));
    }

    document.addEventListener("click",(e)=>{
        if(!input.parentElement.contains(e.target)) close();
    })
}

// ============初始化：词条、武器开启搜索；裂罅等级、属性系数关闭搜索 ============

function switchMode(){
    const mode = document.querySelector('input[name="mode"]:checked').value;
    if(mode === 'forward'){
        document.getElementById('forwardPanel').style.display = "block";
        document.getElementById('reversePanel').style.display = "none";
    }else{
        document.getElementById('forwardPanel').style.display = "none";
        document.getElementById('reversePanel').style.display = "block";
    }
}

//读取组合修正系数，区分正面/负面
function getPropValue(isReverse, isNegativeStat){
    let inputId = isReverse ? "propInputR" : "propInputF";
    const optRaw = document.getElementById(inputId).dataset.opt;
    if(!optRaw) return NaN;
    const opt = JSON.parse(optRaw);
    if(opt.value === 'custom'){
        if(isReverse){
            return Number(document.getElementById('propCoefR').value);
        }else{
            return Number(document.getElementById('propCoef').value);
        }
    }
    return isNegativeStat ? opt.negValue : Number(opt.value);
}

//读取基础数值
function getBaseValue(isReverse){
    let statKey,weaponKey;
    if(!isReverse){
        statKey = document.getElementById("statValueF").value;
        weaponKey = document.getElementById("weaponValueF").value;
    }else{
        statKey = document.getElementById("statValueR").value;
        weaponKey = document.getElementById("weaponValueR").value;
    }
    if(!statKey || !weaponKey) return null;
    //校验词条/武器是否为有效选项
    if(!Object.prototype.hasOwnProperty.call(baseTable, statKey)) return null;
    if(!Object.prototype.hasOwnProperty.call(baseTable[statKey], weaponKey)) return null;
    return baseTable[statKey][weaponKey];
}

//渲染结果并触发入场动画
function showResult(html){
    const el = document.getElementById("result");
    el.innerHTML = html;
    el.classList.remove("pop");
    void el.offsetWidth; //强制重排以重启动画
    el.classList.add("pop");
}
function showWarn(msg){
    showResult(`<div class="warnbox">${msg}</div>`);
}

function calc(){
    const mode = document.querySelector('input[name="mode"]:checked').value;
    if(mode === "forward"){
        const base = getBaseValue(false);
        if(base === null){ showWarn("⚠️ 请先选择有效的词条、武器类型（请从下拉列表中选择）"); return; }
        if(!base){ showWarn("⚠️ 当前词条不支持该武器类型，请更换词条/武器"); return; }
        const prop = getPropValue(false, false);
        const propOptRaw = document.getElementById("propInputF").dataset.opt;
        if(!propOptRaw){ showWarn("⚠️ 请选择属性组合修正系数"); return; }
        const propOpt = JSON.parse(propOptRaw);
        if(propOpt.value === "custom"){
            if(isNaN(prop) || prop < customPropMin){
                showWarn(`⚠️ 请输入有效的自定义属性系数（需 ≥ ${customPropMin}）`); return;
            }
        }
        const rift = Number(document.getElementById("riftCoef").value);
        if(isNaN(rift) || rift < riftCoefMin || rift > riftCoefMax){
            showWarn(`⚠️ 裂罅倾向系数需在 ${riftCoefMin} ~ ${riftCoefMax} 之间`); return;
        }
        const float = Number(document.getElementById("floatCoef").value);
        if(isNaN(float) || float < floatMin || float > floatMax){
            showWarn(`⚠️ 浮动系数需在 ${floatMin} ~ ${floatMax} 之间`); return;
        }
        const riftFloatMul = rift * float;
        const finalVal = base * prop * riftFloatMul;
        showResult(`
            <div class="result-chip green">正向计算结果</div>
            <div class="result-row"><span class="k">基础数值</span><span class="v">${base}</span></div>
            <div class="result-row"><span class="k">裂罅倾向 × 浮动系数</span><span class="v">${riftFloatMul.toFixed(4)}</span></div>
            <div class="result-row"><span class="k">最终词条数值</span><span class="v">${finalVal.toFixed(4)}</span></div>`);
    }else{
        const finalInput = Number(document.getElementById("finalVal").value);
        if(isNaN(finalInput) || finalInput < 0){
            showWarn("⚠️ 最终词条数值需为非负数"); return;
        }
        const isNeg = document.querySelector('input[name="statTypeR"]:checked').value === "negative";
        const final = isNeg ? -Math.abs(finalInput) : finalInput;

        const base = getBaseValue(true);
        if(base === null){ showWarn("⚠️ 请先选择有效的词条、武器、裂罅等级（请从下拉列表中选择）"); return; }
        if(!base){ showWarn("⚠️ 当前词条不支持该武器类型，请更换词条/武器"); return; }
        const prop = getPropValue(true, isNeg);
        const propOptRawR = document.getElementById("propInputR").dataset.opt;
        if(!propOptRawR){ showWarn("⚠️ 请选择属性组合修正系数"); return; }
        const propOptR = JSON.parse(propOptRawR);
        if(propOptR.value === "custom"){
            if(isNaN(prop) || prop < customPropMin){
                showWarn(`⚠️ 请输入有效的自定义属性系数（需 ≥ ${customPropMin}）`); return;
            }
        }
        const riftLv = Number(document.getElementById("riftLvValueR").value);
        if(!riftLv){ showWarn("⚠️ 请选择裂罅等级"); return; }

        const product = final / (base * prop);
        const riftInfo = riftLevelList.find(x=>x.lv === riftLv);
        const productMin = riftInfo.min * floatMin;
        const productMax = riftInfo.max * floatMax;
        const outOfRange = product < productMin || product > productMax;

        let percent;
        if(productMax === productMin){
            percent = 50;
        }else{
            percent = (product - productMin) / (productMax - productMin) * 100;
        }

        let rankText, rankClass;
        if(percent <= 20){ rankText = "评级：很低（低分词条）"; rankClass = 1; }
        else if(percent <= 40){ rankText = "评级：偏低"; rankClass = 2; }
        else if(percent <= 60){ rankText = "评级：中等"; rankClass = 3; }
        else if(percent <= 80){ rankText = "评级：偏高"; rankClass = 4; }
        else{ rankText = "评级：很高（极品词条）"; rankClass = 5; }

        const statTypeName = isNeg ? "负面词条" : "正向词条";
        const barPercent = Math.max(0, Math.min(100, percent));
        showResult(`
            <div class="result-chip">反向计算结果 · ${statTypeName}</div>
            <div class="result-row"><span class="k">基础数值</span><span class="v">${base}</span></div>
            <div class="result-row"><span class="k">选定裂罅等级</span><span class="v">Lv.${riftLv}</span></div>
            <div class="result-row"><span class="k">武器倾向范围</span><span class="v">${riftInfo.min} ~ ${riftInfo.max}</span></div>
            <div class="result-row"><span class="k">裂罅倾向 × 浮动系数</span><span class="v">${product.toFixed(4)}</span></div>
            <div class="result-row"><span class="k">本等级乘积理论区间</span><span class="v">${productMin.toFixed(4)} ~ ${productMax.toFixed(4)}</span></div>
            <div class="percent-bar"><div class="percent-fill ${outOfRange ? "bad" : ""}" style="width:${barPercent.toFixed(2)}%"></div></div>
            <div class="result-row"><span class="k">该数值在本等级内百分比</span><span class="v">${percent.toFixed(2)} %</span></div>
            <div><span class="rank-chip rank-${rankClass}">${rankText}</span></div>
            ${outOfRange ? `<div class="warnbox">⚠️ 警告：该乘积超出本等级理论区间！该数值组合现实不存在！</div>` : ""}`);
    }
}
